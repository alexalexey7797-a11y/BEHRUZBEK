<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BEHRUZBEK</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #050505, #151515, #292929);
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            padding: 40px 25px;
            text-align: center;

            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 30px;

            backdrop-filter: blur(15px);
            box-shadow: 0 0 50px rgba(255,255,255,0.08);
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            opacity: 0.7;
            margin-bottom: 30px;
        }

        .clock {
            font-size: 65px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .date {
            margin-top: 10px;
            opacity: 0.7;
        }

        .people {
            margin-top: 45px;
            height: 170px;

            display: flex;
            justify-content: center;
            align-items: center;

            position: relative;
        }

        .person {
            width: 120px;
            height: 150px;
            position: relative;
        }

        .head {
            width: 55px;
            height: 55px;

            border-radius: 50%;
            background: #f0bd91;

            position: absolute;
            top: 0;
            left: 32px;
        }

        .body {
            width: 75px;
            height: 85px;

            border-radius: 35px 35px 15px 15px;

            position: absolute;
            top: 55px;
            left: 22px;
        }

        .left .body {
            background: #4285f4;
        }

        .right .body {
            background: #e85d9e;
        }

        .arm {
            width: 65px;
            height: 18px;

            background: #f0bd91;
            border-radius: 20px;

            position: absolute;
            top: 75px;
        }

        .left .arm {
            right: -25px;
            transform: rotate(15deg);
        }

        .right .arm {
            left: -25px;
            transform: rotate(-15deg);
        }

        .hands {
            width: 50px;
            height: 28px;

            background: #f0bd91;
            border-radius: 20px;

            position: absolute;
            left: 50%;
            top: 78px;

            transform: translateX(-50%);

            z-index: 5;

            animation: squeeze 1.4s infinite;
        }

        @keyframes squeeze {
            0%, 100% {
                transform: translateX(-50%) scale(1);
            }

            50% {
                transform: translateX(-50%) scale(1.15);
            }
        }

        .heart {
            position: absolute;
            top: -40px;
            left: 50%;

            transform: translateX(-50%);

            font-size: 30px;

            animation: heart 1.4s infinite;
        }

        @keyframes heart {
            0%, 100% {
                transform: translateX(-50%) scale(1);
            }

            50% {
                transform: translateX(-50%) scale(1.3);
            }
        }

        .message {
            margin-top: 15px;
            opacity: 0.8;
            font-size: 18px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 30px;
            }

            .clock {
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 BEHRUZBEK</h1>

    <div class="subtitle">
        Mening shaxsiy saytim
    </div>

    <div id="clock" class="clock">
        00:00:00
    </div>

    <div id="date" class="date">
        Sana
    </div>

    <div class="people">

        <div class="person left">
            <div class="head"></div>
            <div class="body"></div>
            <div class="arm"></div>
        </div>

        <div class="hands">
            <div class="heart">❤️</div>
        </div>

        <div class="person right">
            <div class="head"></div>
            <div class="body"></div>
            <div class="arm"></div>
        </div>

    </div>

    <div class="message">
        🤝 Birgalikda kuchliroq!
    </div>

</div>

<script>

function updateClock() {

    const now = new Date();

    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const seconds = String(now.getSeconds()).padStart(2, "0");

    document.getElementById("clock").textContent =
        `${hours}:${minutes}:${seconds}`;

    const days = [
        "Yakshanba",
        "Dushanba",
        "Seshanba",
        "Chorshanba",
        "Payshanba",
        "Juma",
        "Shanba"
    ];

    const months = [
        "Yanvar",
        "Fevral",
        "Mart",
        "Aprel",
        "May",
        "Iyun",
        "Iyul",
        "Avgust",
        "Sentabr",
        "Oktabr",
        "Noyabr",
        "Dekabr"
    ];

    document.getElementById("date").textContent =
        days[now.getDay()] + ", " +
        now.getDate() + " " +
        months[now.getMonth()] + " " +
        now.getFullYear();
}

updateClock();

setInterval(updateClock, 1000);

</script>

</body>
</html>
