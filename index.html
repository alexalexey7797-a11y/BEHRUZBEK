<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BEHRUZBEK AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at 20% 20%, #4b0082, transparent 35%),
        radial-gradient(circle at 80% 80%, #0047ab, transparent 35%),
        #050510;

    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 750px;

    padding: 30px;

    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 30px;

    backdrop-filter: blur(15px);

    box-shadow: 0 0 50px rgba(80,80,255,0.2);

    text-align: center;
}

h1 {
    font-size: 40px;
    margin-bottom: 8px;
}

.subtitle {
    opacity: 0.7;
    margin-bottom: 25px;
}

/* SOAT */

.clock {
    font-size: 60px;
    font-weight: bold;
    letter-spacing: 4px;

    text-shadow: 0 0 20px rgba(255,255,255,0.5);
}

.date {
    margin-top: 8px;
    opacity: 0.7;
}


/* ODAMLAR */

.people {
    margin: 30px auto;
    height: 150px;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
}

.person {
    width: 110px;
    height: 140px;
    position: relative;
}

.head {
    width: 50px;
    height: 50px;

    border-radius: 50%;

    background: #f0bd91;

    position: absolute;
    top: 0;
    left: 30px;
}

.body {
    width: 70px;
    height: 80px;

    border-radius: 35px 35px 15px 15px;

    position: absolute;
    top: 50px;
    left: 20px;
}

.left .body {
    background: #4285f4;
}

.right .body {
    background: #e85d9e;
}


/* QO'L USHLASH */

.hands {
    position: absolute;

    width: 50px;
    height: 28px;

    background: #f0bd91;

    border-radius: 20px;

    left: 50%;
    top: 65px;

    transform: translateX(-50%);

    z-index: 5;

    animation: squeeze 1.5s infinite;
}

@keyframes squeeze {

    0%, 100% {
        transform: translateX(-50%) scale(1);
    }

    50% {
        transform: translateX(-50%) scale(1.15);
    }

}

.heart {
    position: absolute;

    top: -38px;
    left: 50%;

    transform: translateX(-50%);

    font-size: 28px;

    animation: heart 1.5s infinite;
}

@keyframes heart {

    0%, 100% {
        transform: translateX(-50%) scale(1);
    }

    50% {
        transform: translateX(-50%) scale(1.3);
    }

}


/* AI CHAT */

.ai-chat {
    margin-top: 25px;

    background: rgba(0,0,0,0.25);

    border: 1px solid rgba(255,255,255,0.15);

    border-radius: 20px;

    padding: 15px;
}

.ai-title {
    font-size: 20px;
    font-weight: bold;

    text-align: left;

    padding: 10px;
}

.messages {
    height: 250px;

    overflow-y: auto;

    padding: 10px;

    display: flex;
    flex-direction: column;

    gap: 10px;
}

.chat-message {
    max-width: 80%;

    padding: 11px 15px;

    border-radius: 15px;

    text-align: left;

    line-height: 1.4;
}

.chat-message.ai {
    background: rgba(255,255,255,0.1);

    align-self: flex-start;
}

.chat-message.user {
    background: #444;

    align-self: flex-end;
}

.chat-input {
    display: flex;

    gap: 8px;

    margin-top: 10px;
}

.chat-input input {
    flex: 1;

    height: 45px;

    border: 1px solid rgba(255,255,255,0.2);

    border-radius: 12px;

    padding: 0 15px;

    background: rgba(255,255,255,0.08);

    color: white;

    outline: none;

    font-size: 15px;
}

.chat-input button {
    width: 55px;
    height: 45px;

    border: none;

    border-radius: 12px;

    background: white;

    color: black;

    font-size: 20px;

    cursor: pointer;
}

.chat-input button:hover {
    transform: scale(1.05);
}


/* TELEFON */

@media(max-width:600px) {

    .container {
        padding: 20px;
    }

    h1 {
        font-size: 30px;
    }

    .clock {
        font-size: 42px;
    }

}
</style>

</head>

<body>

<div class="container">

    <h1>🤖 BEHRUZBEK AI</h1>

    <div class="subtitle">
        Mening shaxsiy sun'iy intellektim
    </div>


    <!-- SOAT -->

    <div id="clock" class="clock">
        00:00:00
    </div>

    <div id="date" class="date">
        Sana
    </div>


    <!-- IKKI ODAM -->

    <div class="people">

        <div class="person left">

            <div class="head"></div>

            <div class="body"></div>

        </div>


        <div class="hands">

            <div class="heart">
                ❤️
            </div>

        </div>


        <div class="person right">

            <div class="head"></div>

            <div class="body"></div>

        </div>

    </div>


    <!-- AI CHAT -->

    <div class="ai-chat">

        <div class="ai-title">
            🤖 AI Chat
        </div>


        <div id="messages" class="messages">

            <div class="chat-message ai">
                Salom! 👋 Men BEHRUZBEK AI.
                Menga xabar yozib ko'r!
            </div>

        </div>


        <div class="chat-input">

            <input
                id="userInput"
                type="text"
                placeholder="AI ga xabar yoz..."
            >

            <button onclick="sendMessage()">
                ➤
            </button>

        </div>

    </div>

</div>


<script>

/* SOAT */

function updateClock() {

    const now = new Date();

    const hours =
        String(now.getHours()).padStart(2, "0");

    const minutes =
        String(now.getMinutes()).padStart(2, "0");

    const seconds =
        String(now.getSeconds()).padStart(2, "0");


    document.getElementById("clock").textContent =
        hours + ":" + minutes + ":" + seconds;


    const days = [
        "Yakshanba",
        "Dushanba",
        "Seshanba",
        "Chorshanba",
        "Payshanba",
        "Juma",
        "Shanba"
    ];


    const months = [
        "Yanvar",
        "Fevral",
        "Mart",
        "Aprel",
        "May",
        "Iyun",
        "Iyul",
        "Avgust",
        "Sentabr",
        "Oktabr",
        "Noyabr",
        "Dekabr"
    ];


    document.getElementById("date").textContent =
        days[now.getDay()] +
        ", " +
        now.getDate() +
        " " +
        months[now.getMonth()] +
        " " +
        now.getFullYear();
}


updateClock();

setInterval(updateClock, 1000);


/* AI CHAT */

function sendMessage() {

    const input =
        document.getElementById("userInput");

    const messages =
        document.getElementById("messages");

    const text =
        input.value.trim();


    if (!text) {
        return;
    }


    /* USER XABARI */

    const userMessage =
        document.createElement("div");

    userMessage.className =
        "chat-message user";

    userMessage.textContent =
        text;

    messages.appendChild(userMessage);


    input.value = "";


    messages.scrollTop =
        messages.scrollHeight;


    /* HOZIRCHA TEST AI */

    setTimeout(function() {

        const aiMessage =
            document.createElement("div");

        aiMessage.className =
            "chat-message ai";

        aiMessage.textContent =
            "Xabaringni oldim! 🤖 Hozircha men test rejimidaman.";

        messages.appendChild(aiMessage);


        messages.scrollTop =
            messages.scrollHeight;

    }, 500);

}


/* ENTER BOSILGANDA */

document
.getElementById("userInput")
.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }
);

</script>

</body>
</html>
