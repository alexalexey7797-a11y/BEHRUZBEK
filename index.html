<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEHRUZBEK AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #080b18, #18204a, #090b18);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 800px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 25px;
    padding: 25px;
    backdrop-filter: blur(15px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

h1 {
    text-align: center;
    font-size: 35px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-top: 8px;
}

.clock {
    text-align: center;
    margin: 20px 0;
}

#time {
    font-size: 32px;
    font-weight: bold;
}

#date {
    color: #aaa;
    margin-top: 5px;
}

/* Ikki odam */
.people {
    height: 170px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 70px;
    position: relative;
}

.person {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    position: relative;
}

.person::after {
    content: "";
    position: absolute;
    width: 75px;
    height: 80px;
    border-radius: 35px 35px 10px 10px;
    top: 65px;
    left: -3px;
}

.blue {
    background: #3b82f6;
}

.blue::after {
    background: #2563eb;
}

.pink {
    background: #ec4899;
}

.pink::after {
    background: #db2777;
}

.hands {
    position: absolute;
    width: 100px;
    height: 12px;
    background: white;
    border-radius: 20px;
    left: 50%;
    top: 105px;
    transform: translateX(-50%);
}

.heart {
    position: absolute;
    top: 55px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 30px;
    animation: beat 1s infinite;
}

@keyframes beat {
    50% {
        transform: translateX(-50%) scale(1.3);
    }
}

/* Chat */
.chat {
    margin-top: 20px;
}

.messages {
    height: 300px;
    overflow-y: auto;
    background: rgba(0,0,0,0.25);
    border-radius: 18px;
    padding: 15px;
}

.message {
    padding: 12px 15px;
    border-radius: 15px;
    margin-bottom: 10px;
    max-width: 80%;
    line-height: 1.4;
}

.user {
    background: #2563eb;
    margin-left: auto;
}

.ai {
    background: rgba(255,255,255,0.12);
    margin-right: auto;
}

.input-area {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

input {
    flex: 1;
    padding: 15px;
    border: none;
    outline: none;
    border-radius: 15px;
    font-size: 16px;
}

button {
    border: none;
    padding: 0 22px;
    border-radius: 15px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}
</style>
</head>

<body>

<div class="container">

    <h1>🤖 BEHRUZBEK AI</h1>
    <p class="subtitle">Sening shaxsiy sun'iy intellekting</p>

    <div class="clock">
        <div id="time">00:00:00</div>
        <div id="date">Sana</div>
    </div>

    <div class="people">
        <div class="person blue"></div>
        <div class="person pink"></div>
        <div class="hands"></div>
        <div class="heart">❤️</div>
    </div>

    <div class="chat">

        <div class="messages" id="messages">
            <div class="message ai">
                Salom! 👋 Men BEHRUZBEK AI. Menga xabar yoz!
            </div>
        </div>

        <div class="input-area">
            <input
                id="messageInput"
                type="text"
                placeholder="Xabar yoz..."
                onkeydown="if(event.key === 'Enter') sendMessage()"
            >

            <button onclick="sendMessage()">Yuborish</button>
        </div>

    </div>

</div>

<script>

function updateClock() {
    const now = new Date();

    const time =
        String(now.getHours()).padStart(2, "0") + ":" +
        String(now.getMinutes()).padStart(2, "0") + ":" +
        String(now.getSeconds()).padStart(2, "0");

    document.getElementById("time").textContent = time;

    const days = [
        "Yakshanba",
        "Dushanba",
        "Seshanba",
        "Chorshanba",
        "Payshanba",
        "Juma",
        "Shanba"
    ];

    const date =
        days[now.getDay()] + ", " +
        String(now.getDate()).padStart(2, "0") + "." +
        String(now.getMonth() + 1).padStart(2, "0") + "." +
        now.getFullYear();

    document.getElementById("date").textContent = date;
}

setInterval(updateClock, 1000);
updateClock();


function addMessage(text, type) {

    const messages = document.getElementById("messages");

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;
}


async function sendMessage() {

    const input = document.getElementById("messageInput");

    const message = input.value.trim();

    if (!message) return;

    addMessage(message, "user");

    input.value = "";

    try {

        const response = await fetch(
            "http://127.0.0.1:5000/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message
                })
            }
        );

        const data = await response.json();

        addMessage(data.reply, "ai");

    } catch (error) {

        addMessage(
            "Server bilan aloqa yo‘q 😕",
            "ai"
        );

    }
}

</script>

</body>
</html>
